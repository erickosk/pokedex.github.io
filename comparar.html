<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ed1c24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Orbitron:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Comparador - Pokédex</title>
  <meta name="description" content="Compara las estadísticas y tipos de dos Pokémon.">
</head>
<body>

  <script src="js/datos.js"></script>
  <script src="js/regiones.js"></script>
  <script src="js/idioma.js"></script>
  <script src="js/favoritos.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/cabecera.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tipos.js"></script>

  <main class="detalle comparador" id="comparador">
    <div class="comp-form">
      <h2 data-i18n="comp_titulo">Comparador</h2>
      <datalist id="lista-pokemon"></datalist>
      <input type="text" id="comp-a" list="lista-pokemon" data-i18n-ph="comp_a" autocomplete="off">
      <button type="button" id="comp-swap" class="mini" data-i18n="comp_cambiar">Intercambiar</button>
      <input type="text" id="comp-b" list="lista-pokemon" data-i18n-ph="comp_b" autocomplete="off">
      <button type="button" id="comp-ir" class="volver" data-i18n="comp_ir">Comparar</button>
    </div>
    <p id="comp-msg" class="nota"></p>
    <div id="comp-res" class="comp-res"></div>
    <div class="acciones"><a class="volver" href="index.html" data-i18n="volver">Volver a la Pokédex</a></div>
  </main>

  <script src="js/efectos.js"></script>
  <script src="js/comparar.js"></script>
  <script src="js/musica.js"></script>

</body>
</html>
