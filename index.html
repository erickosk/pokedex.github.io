<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ed1c24">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23222' stroke-width='6'/%3E%3Cpath d='M4 50a46 46 0 0 1 92 0z' fill='%23ed1c24' stroke='%23222' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23fff' stroke='%23222' stroke-width='6'/%3E%3C/svg%3E">
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Orbitron:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Enlace al archivo de estilos -->
  <link rel="stylesheet" href="css/styles.css">
  <title>Pokédex - Generación I y regiones</title>
  <meta name="description" content="Pokédex con los 151 Pokémon de la primera generación, filtros por tipo, buscador y todas las regiones del mundo Pokémon.">
  <meta property="og:title" content="Pokédex">
  <meta property="og:description" content="Los 151 Pokémon de Kanto, filtros por tipo y todas las regiones.">
  <meta property="og:type" content="website">
</head>
<body>

  <!-- ENCABEZADO: se escribe desde js/cabecera.js (igual en todas las páginas) -->
  <script src="js/datos.js"></script>
  <script src="js/regiones.js"></script>
  <script src="js/cabecera.js"></script>

  <div class="contenedor">

    <!-- TARJETAS: se dibujan desde js/datos.js (cada una es un enlace a su página) -->
    <section class="tarjetas" id="tarjetas" aria-live="polite"></section>

    <!-- PANEL ROJO DE LA DERECHA (buscar + tipo + regiones) -->
    <aside class="panel">
      <input type="text" id="buscar" placeholder="buscar" aria-label="Buscar Pokémon" autocomplete="off">
      <p class="atajo">Pulsa <kbd>/</kbd> para buscar</p>
      <p class="contador" id="contador"></p>

      <div class="tipos">
        <h3>Elemento / Tipo</h3>
        <div id="info-tipo">
          <p>Elige un tipo en la barra de arriba.</p>
        </div>
      </div>

      <div class="tipos regiones">
        <h3>Regiones</h3>
        <div class="lista-regiones" id="lista-regiones"></div>
      </div>
    </aside>

  </div>

  <noscript><p style="text-align:center;padding:30px">Esta Pokédex necesita JavaScript para mostrar los Pokémon.</p></noscript>

  <script src="js/efectos.js"></script>
  <script src="js/index.js"></script>
  <script src="js/musica.js"></script>

</body>
</html>
